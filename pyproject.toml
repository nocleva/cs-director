[project]
name = "cs2-director"
version = "0.1.0"
description = "FACEIT CS2 maç verilerinden taktik ve oyuncu analizi yapan Gaming Director"
readme = "CLAUDE.md"
# awpy / demoparser2 tekerlekleri en yeni Python sürümünü geç destekler; 3.11-3.13 aralığında kalıyoruz
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.0",
    "awpy>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "zstandard>=0.25.0",
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
    "watchdog>=6.0.0",
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
director = "director.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
