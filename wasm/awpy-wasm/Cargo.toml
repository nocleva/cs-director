[package]
name = "awpy-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "SquadMind: awpy 3.1.1 ayrıştırıcısını WASM'a derler; demodan küçük, sütun tabanlı bir paket üretir"
license = "MIT"
publish = false

# Depo kökündeki (varsa) bir workspace'e karışmasın
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Çekirdek ayrıştırıcı: kurulu Python awpy'sinin (3.1.1) birebir aynı kaynağı
awpy = { git = "https://github.com/pnxenopoulos/awpy", tag = "awpy-python-v3.1.1" }
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Panik mesajı tarayıcı konsoluna düşsün
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
