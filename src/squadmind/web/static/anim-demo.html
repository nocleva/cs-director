<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Düello animasyonu demo</title>
<link rel="stylesheet" href="css/squadmind.css">
<style>
 body{background:var(--bg-0,#0D1018);color:var(--text-2,#BAC4DE);font:13px var(--font,sans-serif);margin:0;padding:16px}
 h1{font-size:15px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
 .cell{background:var(--bg-1,#141826);border-radius:10px;padding:8px}
 svg{width:100%;height:150px;display:block} button{background:var(--accent,#FF6A1F);border:0;border-radius:6px;padding:4px 10px;color:var(--on-accent,#1A0E05);cursor:pointer}
 .tok{stroke:var(--line,#F4F6FB);stroke-width:1.5}
</style></head><body>
<h1>Mini düello (yalnız geliştirme) <button id="all">Hepsini oynat</button></h1>
<div class="grid" id="g"></div>
<script type="module">
import { playDuel } from './js/sm-duel-anim.js';
// ?t=ms: kareyi o ana sabitle (ekran görüntüsü için)
const TQ=new URLSearchParams(location.search).get('t');
if(TQ!==null){const seen=new WeakSet();window.requestAnimationFrame=(f)=>{if(!seen.has(f)){seen.add(f);setTimeout(()=>{f(1);f(1+Number(TQ));},0);}return 1;};}
const NS='http://www.w3.org/2000/svg', W=['rifle','awp','pistol','smg','scout','heavy'];
const cases=[];
for (const w of W) cases.push({t:w+' vs rifle',wa:w,wb:'rifle',vis:true,oc:null});
cases.push({t:'awp vs awp',wa:'awp',wb:'awp',vis:true,oc:null},{t:'smg vs pistol',wa:'smg',wb:'pistol',vis:true,oc:null});
cases.push({t:'görüş yok',wa:'rifle',wb:'awp',vis:false,oc:null});
// üç sonuç durumu: çağıran verir (burada elle)
cases.push({t:'outcome a',wa:'rifle',wb:'awp',vis:true,oc:'a'},{t:'outcome b',wa:'rifle',wb:'awp',vis:true,oc:'b'},{t:'outcome null',wa:'rifle',wb:'awp',vis:true,oc:null});
const g=document.getElementById('g'), runs=[];
cases.forEach((c,i)=>{
  const d=document.createElement('div'); d.className='cell'; d.innerHTML='<div>'+c.t+' <button>oynat</button></div>';
  const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 300 150'); d.appendChild(s); g.appendChild(d);
  const tok=(x,y,side)=>{const e=document.createElementNS(NS,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',14);e.setAttribute('class','tok');e.setAttribute('fill',side==='CT'?'#38E1D0':'#FF6A1F');e.setAttribute('fill-opacity',.35);s.appendChild(e)};
  tok(50,75,'T');tok(250,75,'CT');
  let h=null; const run=()=>{h&&h.stop();h=playDuel(s,{a:{x:50,y:75,side:'T',weapon:c.wa},b:{x:250,y:75,side:'CT',weapon:c.wb},visible:c.vis,seed:i+1,outcome:c.oc})};
  d.querySelector('button').onclick=run; runs.push(run);
});
document.getElementById('all').onclick=()=>runs.forEach(f=>f());
// ?t=ms: o ana kadar hızlandırılmış kare yakalama için (ekran görüntüsü)
runs.forEach(f=>f());
</script></body></html>
