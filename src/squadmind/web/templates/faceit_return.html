<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FACEIT girişi · SquadMind</title>
<style>
  /* FACEIT'ten dönüş: anahtar adresin # kısmında, sunucuya bu sayfa iletir */
  html, body { margin: 0; background: #111214; color: #E9EBEE; font: 14px/1.5 Inter, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #2E3237; border-top-color: #F37321; margin: 0 auto 14px; animation: s 800ms linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main><div><div class="spin" aria-hidden="true"></div><p>FACEIT girişi tamamlanıyor…</p></div></main>
<form id="f" method="post" action="/giris/faceit/anahtar" hidden>
  <input name="access_token"><input name="state"><input name="error">
</form>
<script>
  // Anahtarı adres çubuğundan hemen sil (geçmişte / ekran paylaşımında görünmesin)
  const h = new URLSearchParams(location.hash.slice(1));
  const q = new URLSearchParams(location.search);
  history.replaceState(null, "", location.pathname);
  const f = document.getElementById("f");
  // FACEIT Connect anahtarı "token" adıyla verir (standart ad "access_token"); force_qs ile
  // # yerine sorgu kısmında da gelebilir
  const token = h.get("token") || h.get("access_token") || q.get("token") || q.get("access_token") || "";
  f.access_token.value = token;
  f.state.value = h.get("state") || q.get("state") || "";
  f.error.value = h.get("error_description") || h.get("error") || q.get("error_description") || q.get("error") || (token ? "" : "anahtar gelmedi");
  f.submit();
</script>
</body>
</html>
