<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SquadMind{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6b7a;
    --line: #dde2e8; --accent: #e8590c; --ok: #2b8a3e; --warn: #b7791f; --bad: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a2b3;
      --line: #2c3442; --accent: #ff8a3d; --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header a { color: var(--muted); text-decoration: none; margin-left: 14px; }
  header strong { color: var(--accent); letter-spacing: .5px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; } h2 { font-size: 17px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
                     border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; }
  button, .btn { display: inline-block; padding: 10px 16px; border: 0; border-radius: 8px;
                 background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
                 text-decoration: none; font-size: 15px; }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .error { color: var(--bad); margin: 10px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .st-tamam { color: var(--ok); } .st-reddedildi, .st-tutmadı { color: var(--warn); }
  .st-hata { color: var(--bad); }
  .report table { margin: 8px 0 16px; }
  .report h2 { margin-top: 24px; } .report h3, .report h4 { margin: 18px 0 6px; }
</style>
</head>
<body>
<header>
  <strong>SQUADMIND</strong>
  <nav>{% block nav %}{% endblock %}</nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
