<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}SquadMind{% endblock %}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Uygulama sayfaları: taktik tahtasıyla aynı tokenlar (tek koyu tema) */
  :root {
    --bg-0: #0F1319; --bg-1: #151A21; --bg-2: #1D242D; --bg-3: #2A333F;
    --line: #F2F5F8; --muted: #8E9AA8; --text-2: #B4C0CE;
    --accent: #FF8A3D; --accent-2: #4FD1C5; --enemy: #FF5C62; --r: 14px; --ease: cubic-bezier(.2,.7,.2,1);
    --ok: #3FD07A; --mid: #FF8A3D; --low: #FF5C62;
    --font: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-0); overflow-x: hidden; color: var(--line); }
  body { font: 14px/1.55 var(--font); }
  a { color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tnum { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); }

  header.bar { border-bottom: 1px solid var(--bg-3); background: rgba(21,26,33,.92); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px); }
  header.bar .wrap { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--line); text-decoration: none; }
  nav.nav { display: flex; gap: 8px; align-self: stretch; overflow-x: auto; }
  nav.nav a { display: flex; align-items: center; color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500; padding: 0 14px; border-radius: 999px; align-self: center; height: 34px; white-space: nowrap; transition: background 180ms var(--ease), color 180ms var(--ease); }
  nav.nav a:hover { color: var(--line); background: var(--bg-2); }
  nav.nav a[aria-current="page"] { color: var(--bg-0); background: var(--accent); font-weight: 600; }
  .acct { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .acct a { color: var(--text-2); text-decoration: none; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--line); }
  @media (max-width: 720px) { nav.nav { order: 3; width: 100%; padding-bottom: 8px; flex-wrap: wrap; overflow-x: visible; gap: 6px; } nav.nav a { padding: 0 12px; height: 32px; } }

  main { padding-block: 24px 48px; animation: page-in 320ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; margin: 6px 0 4px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .sub { color: var(--text-2); margin: 0; }
  .card { background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

  input[type=text], select { height: 40px; padding: 0 12px; border: 1px solid var(--bg-3); border-radius: 10px; background: var(--bg-0); color: var(--line); font: 14px var(--font); }
  input[type=file] { color: var(--text-2); font: 13px var(--font); max-width: 100%; }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--bg-0); font: 600 13px var(--font); cursor: pointer; text-decoration: none; transition: transform 150ms var(--ease), filter 150ms var(--ease); }
  .btn:hover, button:hover { filter: brightness(1.1); } .btn:active, button:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { .btn, button { transition: none; } .btn:active, button:active { transform: none; } }
  .btn.ghost, button.ghost { background: transparent; color: var(--line); border: 1px solid var(--bg-3); }
  .btn.small, button.small { height: 30px; padding: 0 10px; font-size: 12px; }
  button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: var(--enemy); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--bg-3); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .table-wrap { overflow-x: auto; }
  .st-tamam { color: var(--ok); } .st-reddedildi, .st-tutmadı { color: var(--mid); } .st-hata { color: var(--low); }

  /* Demo durumu: ≤5 kırmızı, 6-9 turuncu, ≥10 yeşil */
  .lvl-low { --c: var(--low); } .lvl-mid { --c: var(--mid); } .lvl-ok { --c: var(--ok); }
  .meter { height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--c); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }

  .report table { margin: 8px 0 16px; }
  .report h1 { font-size: 24px; } .report h2 { margin-top: 26px; } .report h3, .report h4 { margin: 18px 0 6px; }
  .report p, .report li { color: var(--text-2); }
  .report strong { color: var(--line); }
  footer.foot { border-top: 1px solid var(--bg-3); }
  footer.foot .wrap { padding-block: 14px 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  footer.foot a { color: inherit; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="/ben"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 2v15h13" fill="none" stroke="#F37321" stroke-width="2.2" stroke-linecap="square"></path><path d="M13 13l4 4-4 4" fill="none" stroke="#F37321" stroke-width="2.2" stroke-linecap="square"></path></svg>SquadMind</a>
    {% if me %}
    {% set path = request.url.path %}
    <nav class="nav" aria-label="Bölümler">
      <a href="/arena"{% if path.startswith("/arena") %} aria-current="page"{% endif %}>Arena</a>
      <a href="/ben"{% if path == "/ben" %} aria-current="page"{% endif %}>Genel bakış</a>
      <a href="/demolar"{% if path == "/demolar" %} aria-current="page"{% endif %}>Demo yönetimi</a>
      <a href="/takimlar"{% if path.startswith("/takimlar") %} aria-current="page"{% endif %}>Takımlarım</a>
    </nav>
    <div class="acct"><span class="avatar" title="{{ me.nickname }}">{{ me.nickname[:2] | upper }}</span><a href="/hesap"{% if path == "/hesap" %} aria-current="page"{% endif %}>Hesabım</a><a href="/cikis">Çıkış</a></div>
    {% endif %}
  </div>
</header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer class="foot"><div class="wrap"><span>SquadMind · FACEIT / CS2 takım analizi</span><span><a href="/privacy">Gizlilik</a> · <a href="/terms">Kullanım şartları</a></span></div></footer>
<script>
// FACEIT girişi açılır pencerede (FACEIT Connect böyle çalışır); engellenirse normal bağlantı
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest('a[href^="/giris/faceit"]');
  if (!a || a.getAttribute("href").indexOf("/giris/faceit/") === 0) return;
  var w = 750, h = 825, x = Math.max(0, (screen.width - w) / 2), y = Math.max(0, (screen.height - h) / 2);
  var url = a.href + (a.href.indexOf("?") < 0 ? "?" : "&") + "popup=1";
  var pop = window.open(url, "faceit_giris", "width=" + w + ",height=" + h + ",left=" + x + ",top=" + y);
  if (pop) { e.preventDefault(); pop.focus(); }
});
</script>
</body>
</html>
