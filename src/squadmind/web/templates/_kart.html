{# Oyuncu kartı bileşeni: window.SMCard.render(kart, {compact}), emblem, avatar ve karşılaştırma tablosu. Stil: static/css/squadmind.css (bölüm 5).
   Girdi /api/kart/{steam_id} JSON'u (analysis/cards.py sözleşmesi). Tüm metin textContent ile yazılır. #}
<script>
// Kart bileşeni. Sayıları yalnız gösterir; hiçbir puan üretmez (silah satırlarında 0-100 puan yok).
window.SMCard = (function () {
  const WEAPONS = [["awp", "AWP"], ["rifle", "Tüfek"], ["pistol", "Tabanca"], ["scout", "Scout"]];
  const DESC = [["opening_win", "Açılış düellosu kazanma", "pct"], ["trade_kill", "Trade'li kill payı", "pct"],
                ["clutch_win", "Clutch kazanma", "pct"], ["support_dmg_per_round", "Öldürmeden hasar / round", "num"]];
  const FOOT = "Silah ve betimleyici satırlar sınamayı geçmedi; düello olasılığını yalnız canlı ELO, silah ve can belirler.";
  const LV_COLOR = { 1: "#CFCFCF", 2: "#1CE400", 3: "#1CE400", 4: "#FFC800", 5: "#FFC800", 6: "#FFC800", 7: "#FFC800", 8: "#FF6309", 9: "#FF6309", 10: "#FE1F00" };
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pct = (v) => "%" + Math.round(v * 100);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const num = (v) => v.toLocaleString("tr-TR", { maximumFractionDigits: 1 });

  // Aralık çubuğu: scale = üst sınır (puan için 100, oran için 1); lo/hi yoksa yalnız nokta
  function bar(cls, value, lo, hi, scale, ticks) {
    const b = h("div", "sk-bar " + cls);
    if (ticks) for (let i = 1; i < 10; i++) { const t = h("i", "tk"); t.style.left = i * 10 + "%"; b.appendChild(t); }
    if (lo != null && hi != null) {
      const r = h("span", "rng"); r.style.left = clamp(lo / scale, 0, 1) * 100 + "%";
      r.style.width = Math.max(0.8, (clamp(hi / scale, 0, 1) - clamp(lo / scale, 0, 1)) * 100) + "%"; b.appendChild(r);
    }
    if (value != null) { const p = h("span", "pt"); p.style.left = clamp(value / scale, 0, 1) * 100 + "%"; b.appendChild(p); }
    return b;
  }

  function weaponRow(name, w) {
    const row = h("div", "sk-row");
    const head = h("div", "sk-row-h"); head.appendChild(h("span", "", name));
    const v = h("span", "v");
    if (w.n < 20 || w.lo == null) {
      row.classList.add("nodata"); v.textContent = "veri yok"; head.appendChild(v); row.appendChild(head);
      row.appendChild(bar("raw empty"));
      const m = h("div", "sk-meta"); m.appendChild(h("span", "", w.n + " düello (en az 20 gerekir)")); row.appendChild(m); return row;
    }
    v.textContent = w.wins + " / " + w.n; v.appendChild(h("i", "", pct(w.wins / w.n)));
    head.appendChild(v); row.appendChild(head);
    row.appendChild(bar("raw", w.wins / w.n, w.lo, w.hi, 1));
    const m = h("div", "sk-meta");
    m.appendChild(h("span", "", "%90 aralık " + pct(w.lo) + "–" + pct(w.hi) + " · " + w.label));
    m.appendChild(h("span", "sk-chip dash", w.validated ? "doğrulandı" : "doğrulanmadı"));
    row.appendChild(m); return row;
  }

  function descRow(name, kind, d) {
    const row = h("div", "sk-row");
    const head = h("div", "sk-row-h"); head.appendChild(h("span", "", name));
    const v = h("span", "v");
    if (!d || d.value == null) {
      row.classList.add("nodata"); v.textContent = "veri yok"; head.appendChild(v); row.appendChild(head);
      const m = h("div", "sk-meta"); m.appendChild(h("span", "", (d ? d.n : 0) + " örnek (en az 20 gerekir)")); row.appendChild(m); return row;
    }
    v.textContent = kind === "pct" ? pct(d.value) : num(d.value);
    head.appendChild(v); row.appendChild(head);
    const m = h("div", "sk-meta");
    if (kind === "pct" && d.lo != null) {
      row.appendChild(bar("raw", d.value, d.lo, d.hi, 1));
      m.appendChild(h("span", "", "%90 aralık " + pct(d.lo) + "–" + pct(d.hi) + " · n = " + d.n));
    } else m.appendChild(h("span", "", "n = " + d.n + (kind === "num" ? " round" : "")));
    m.appendChild(h("span", "", d.label)); row.appendChild(m); return row;
  }

  // ---- Görsel yer tutucular: Gemini görselleri gelene kadar SVG; gelince (assets/gelen → static/img) görselle değişir ----
  const SVGNS = "http://www.w3.org/2000/svg";
  const sv = (tag, at, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
  let uid = 0;
  const hash = (s) => { let x = 2166136261; for (const ch of String(s || "?")) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
  const HEX = "24,1 46,13 46,39 24,51 2,39 2,13";
  // Görsel varsa kullan (manifest yüklenince); yoksa hiçbir şey yapma
  const whenAssets = (fn) => { const go = () => window.SMAssets && SMAssets.onReady(fn); if (window.SMAssets) go(); else document.addEventListener("DOMContentLoaded", go, { once: true }); };

  // Seviye amblemi: altıgen kalkan + elmas + numara. Renk FACEIT seviye bandı renginden (logo değil).
  function emblem(level) {
    const box = h("div", "sk-emblem"), col = level ? (LV_COLOR[level] || "#8E9AA8") : "#5A6485";
    const s = sv("svg", { viewBox: "0 0 48 52", "aria-hidden": "true" }, box);
    sv("polygon", { points: HEX, fill: col, stroke: "#0D1018", "stroke-width": 2, "stroke-linejoin": "round" }, s);
    sv("polygon", { points: "24,6 41,15.5 41,36.5 24,46 7,36.5 7,15.5", fill: "rgba(10,13,22,.82)", stroke: col, "stroke-width": 1.4 }, s);
    sv("polygon", { points: "24,8 27.5,11.5 24,15 20.5,11.5", fill: col }, s);
    sv("path", { d: "M2 20l-1 6 1 6M46 20l1 6-1 6", stroke: col, "stroke-width": 1.6, fill: "none", "stroke-linecap": "round" }, s);
    const t = sv("text", { x: 24, y: level === 10 ? 34 : 35, "text-anchor": "middle", fill: col, "font-weight": 700, "font-size": level === 10 ? 17 : 21, style: "font-family:var(--font-display);font-style:italic" }, s);
    t.textContent = level ? String(level) : "?";
    if (level) whenAssets(() => { if (SMAssets.has("rozet-" + level + ".png")) { const i = new Image(); i.alt = ""; i.src = SMAssets.url("rozet-" + level + ".png"); box.replaceChildren(i); } });
    return box;
  }

  // Soyut oyuncu avatarı: addan türeyen renk çifti, çapraz çizgiler, maskeli siluet (karakter değil, geometrik)
  const AV_COLORS = ["#FF6A1F", "#8B6CFF", "#38E1D0", "#FF5C62", "#3FD07A", "#F5C542"];
  function avatar(name) {
    const hs = hash(name), i1 = hs % AV_COLORS.length;
    let i2 = (hs >> 3) % AV_COLORS.length; if (i2 === i1) i2 = (i2 + 2) % AV_COLORS.length;   // iki renk hep farklı
    const c1 = AV_COLORS[i1], c2 = AV_COLORS[i2];
    const box = h("div", "sk-avatar"), id = "av" + (++uid);
    const s = sv("svg", { viewBox: "0 0 48 52", "aria-hidden": "true" }, box);
    const defs = sv("defs", {}, s);
    const g = sv("linearGradient", { id: id + "g", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    sv("stop", { offset: 0, "stop-color": c1 }, g); sv("stop", { offset: 1, "stop-color": c2 }, g);
    const cp = sv("clipPath", { id: id + "c" }, defs); sv("polygon", { points: HEX }, cp);
    sv("polygon", { points: HEX, fill: "url(#" + id + "g)" }, s);
    const inner = sv("g", { "clip-path": "url(#" + id + "c)" }, s);
    for (let i = -2; i < 6; i++) sv("path", { d: "M" + (i * 10) + " 52L" + (i * 10 + 30) + " 0", stroke: "rgba(255,255,255,.14)", "stroke-width": 3 }, inner);
    sv("circle", { cx: 24, cy: 21, r: 9, fill: "rgba(10,13,22,.62)" }, inner);
    sv("path", { d: "M6 54Q24 28 42 54Z", fill: "rgba(10,13,22,.62)" }, inner);
    sv("rect", { x: 15.5, y: 19, width: 17, height: 4, rx: 2, fill: "rgba(255,255,255,.85)" }, inner);
    sv("polygon", { points: HEX, fill: "none", stroke: "rgba(255,255,255,.7)", "stroke-width": 1.4, "stroke-linejoin": "round" }, s);
    whenAssets(() => { const f = "avatar-" + (hs % 8 + 1) + ".png"; if (SMAssets.has(f)) { const i = new Image(); i.alt = ""; i.src = SMAssets.url(f); box.replaceChildren(i); } });
    return box;
  }

  // Güç puanı (istatistik ekibinin tek puanı) varsa onu büyük göster; yoksa genel (seviye ölçeği) puanı
  function powerOf(c) { return c.power && c.power.score != null ? c.power : null; }

  function compRow(cp) {
    const row = h("div", "sk-row"), head = h("div", "sk-row-h");
    head.appendChild(h("span", "", cp.label || cp.name || "Bileşen"));
    const v = h("span", "v"), has = cp.value != null || cp.display != null;
    v.textContent = !has ? "veri yok" : (cp.display != null ? String(cp.display) : num(cp.value));
    head.appendChild(v); row.appendChild(head);
    if (!has) row.classList.add("nodata");
    else if (cp.lo != null && cp.hi != null) row.appendChild(bar("raw", cp.value, cp.lo, cp.hi, cp.scale || 100));
    const note = cp.note || (cp.weight != null ? "ağırlık " + pct(cp.weight) : "");
    if (note) { const m = h("div", "sk-meta"); m.appendChild(h("span", "", note)); row.appendChild(m); }
    return row;
  }

  function render(c, opts) {
    opts = opts || {};
    const root = h("article", "sk" + (opts.compact ? " compact" : ""));
    root.setAttribute("aria-label", (c.nickname || "Oyuncu") + " kartı");
    root.style.setProperty("--lv", c.faceit_level ? (LV_COLOR[c.faceit_level] || "#8E9AA8") : "#5A6485");
    const inner = h("div", "sk-in"); root.appendChild(inner);

    // Afiş: avatar, ad, seviye amblemi
    const ban = h("div", "sk-banner");
    const id = h("div", "sk-id"); id.appendChild(h("div", "sk-nm", c.nickname || "Bilinmeyen oyuncu"));
    id.appendChild(h("div", "sk-sub", c.faceit_level ? "FACEIT seviye " + c.faceit_level + " · CS2" : "FACEIT seviyesi alınamadı"));
    const emb = emblem(c.faceit_level); emb.title = c.faceit_level ? "FACEIT seviye " + c.faceit_level : "Seviye bilinmiyor";
    ban.append(avatar(c.nickname), id, emb); inner.appendChild(ban);
    const elo = h("div", "sk-elo"); elo.appendChild(h("b", "tnum", c.elo != null ? String(Math.round(c.elo)) + " ELO" : "ELO alınamadı")); elo.appendChild(h("span", "", "canlı FACEIT"));
    inner.appendChild(elo);

    // Ana puan bloğu
    const g = c.general, pw = powerOf(c), main = pw || g;
    const gen = h("div", "sk-gen"), gh = h("div", "sk-gen-h"), big = h("div", "sk-big");
    if (main.score == null) { big.classList.add("nodata"); big.textContent = "veri yok"; }
    else { big.textContent = String(Math.round(main.score)); big.appendChild(h("small", "", "/" + (main.scale_max || 100))); }
    const side = h("div", ""); side.style.textAlign = "right";
    side.appendChild(h("div", "sk-tag", pw ? "Güç puanı" : "Genel · " + g.scale));
    const confTxt = pw ? (pw.conf || pw.confidence || "") : g.conf;
    if (confTxt) side.appendChild(h("span", "sk-chip" + (confTxt === "yeterli" ? "" : " warn"), confTxt));
    gh.append(big, side); gen.appendChild(gh);
    const lo = main.lo, hi = main.hi, sc = main.scale_max || 100;
    gen.appendChild(bar("gen", main.score, lo, hi, sc, true));
    const gm = h("div", "sk-meta");
    const exact = main.score != null && lo != null && Math.abs(hi - lo) < 0.05;   // aralık yok: canlı ELO birebir
    gm.appendChild(h("span", "tnum", main.score == null ? "Puan hesaplanamadı." : (exact ? "Canlı ELO birebir: aralık yok" : lo == null ? "Aralık yok" : "%90 aralık " + Math.round(lo) + "–" + Math.round(hi))));
    if (pw) gm.appendChild(h("span", "sk-chip dash", pw.validated === true ? "doğrulandı" : pw.validated === false ? "doğrulanmadı" : "doğrulama bilgisi yok"));
    else gm.appendChild(h("span", "", "çubuk: seviye 1 → 10"));
    gen.appendChild(gm);
    if (pw && pw.components && pw.components.length) {
      const cs = h("div", "sk-comps"); cs.appendChild(h("h3", "sk-tag", "Puanın parçaları"));
      for (const cp of pw.components) cs.appendChild(compRow(cp));
      gen.appendChild(cs);
    }
    if (pw && g && g.score != null) {
      const gr = compRow({ label: "Seviye ölçeği (canlı ELO)", value: g.score, lo: g.lo, hi: g.hi, display: Math.round(g.score) });
      gen.appendChild(gr);
    }
    gen.appendChild(h("p", "sk-note", "Düello olasılığı bu puanın kaynağı olan canlı ELO'dan hesaplanır."));
    inner.appendChild(gen);

    // Silah satırları: ham galibiyet / düello, puan yok
    const ws = h("section", "sk-sec"); ws.appendChild(h("h3", "sk-tag", "Silahla düello kaydı"));
    for (const [k, nm] of WEAPONS) if (c.weapons[k]) ws.appendChild(weaponRow(nm, c.weapons[k]));
    inner.appendChild(ws);

    // Betimleyiciler
    if (!opts.compact) {
      const ds = h("section", "sk-sec"); ds.appendChild(h("h3", "sk-tag", "Betimleyiciler"));
      for (const [k, nm, kind] of DESC) ds.appendChild(descRow(nm, kind, c.descriptive[k]));
      inner.appendChild(ds);
    }

    // Alt şerit
    const strip = h("div", "sk-strip");
    for (const [v, t] of [[c.counts.demos, "yüklü demo"], [c.counts.rounds, "analiz edilen round"], [c.counts.duels, "düello"]]) {
      const d = h("div"); d.appendChild(h("b", "", Number(v).toLocaleString("tr-TR"))); d.appendChild(h("span", "", t)); strip.appendChild(d);
    }
    inner.appendChild(strip);
    if (!opts.compact && g.combined_elo != null) {
      const cb = h("div", "sk-comb");
      cb.appendChild(h("span", "", "Stat ekiyle (kanıtı zayıf): birleşik ELO " + Math.round(g.combined_elo)));
      inner.appendChild(cb);
    }
    inner.appendChild(h("p", "sk-foot", FOOT));
    whenAssets(() => { if (SMAssets.has("kart-cerceve.png")) root.style.setProperty("--frame-img", "url(" + SMAssets.url("kart-cerceve.png") + ")"); });
    return root;
  }

  function skeleton() { return h("div", "sk-skel"); }

  // İki kartı yan yana kıyasla. "Belirgin" yalnız %90 aralıklar ayrıkken; aksi halde "belirsiz".
  function compare(a, b) {
    const tbl = h("table", "sk-cmp"), thead = h("thead"), tr = h("tr");
    for (const t of ["", a.nickname || "A", b.nickname || "B", "Fark"]) tr.appendChild(h("th", "", t));
    thead.appendChild(tr); tbl.appendChild(thead);
    const body = h("tbody"); tbl.appendChild(body);
    const cell = (x, fmt) => { const td = h("td", "num"); if (x.value == null) { td.textContent = "veri yok"; td.style.color = "var(--muted)"; } else { td.textContent = fmt(x.value); if (x.lo != null && x.hi - x.lo >= 0.05) td.appendChild(h("i", "", fmt(x.lo) + "–" + fmt(x.hi))); } return td; };
    function add(label, x, y, fmt) {
      const r = h("tr"); r.appendChild(h("td", "", label));
      const ca = cell(x, fmt), cb = cell(y, fmt); r.append(ca, cb);
      let verdict = "veri yok";
      if (x.value != null && y.value != null) {
        if (x.lo != null && y.lo != null && x.hi - x.lo < 0.05 && y.hi - y.lo < 0.05) {
          verdict = "kesin ELO sıralaması";   // iki ELO da birebir: aralık yok, "belirgin" denmez
          if (x.value > y.value) ca.classList.add("win"); else if (y.value > x.value) cb.classList.add("win");
        } else if (x.lo != null && y.lo != null) {
          if (x.lo > y.hi) { verdict = "belirgin: " + (a.nickname || "A"); ca.classList.add("win"); }
          else if (y.lo > x.hi) { verdict = "belirgin: " + (b.nickname || "B"); cb.classList.add("win"); }
          else verdict = "belirsiz";
        } else verdict = "aralık yok";
      }
      r.appendChild(h("td", "sep", verdict)); body.appendChild(r);
    }
    const sc = (c) => ({ value: c.general.score, lo: c.general.lo, hi: c.general.hi });
    if (a.power && a.power.score != null && b.power && b.power.score != null) {
      const pwr = (c) => ({ value: c.power.score, lo: c.power.lo, hi: c.power.hi });
      add("Güç puanı", pwr(a), pwr(b), (v) => String(Math.round(v)));
    }
    add("Genel (seviye ölçeği)", sc(a), sc(b), (v) => String(Math.round(v)));
    const ev = (c) => ({ value: c.elo, lo: c.elo, hi: c.elo });   // FACEIT'ten birebir: aralık yok
    add("Canlı ELO", ev(a), ev(b), (v) => String(Math.round(v)));
    for (const [k, nm] of WEAPONS) {
      const wr = (c) => { const w = c.weapons[k]; return w && w.n >= 20 && w.lo != null ? { value: w.wins / w.n, lo: w.lo, hi: w.hi } : { value: null }; };
      add(nm + " (galibiyet, doğrulanmadı)", wr(a), wr(b), pct);
    }
    for (const [k, nm, kind] of DESC) {
      const d = (c) => c.descriptive[k] || { value: null };
      add(nm, d(a), d(b), kind === "pct" ? pct : num);
    }
    return tbl;
  }
  return { render, skeleton, compare, emblem, avatar, FOOT, LV_COLOR };
})();
</script>
